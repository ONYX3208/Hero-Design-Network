server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Try the file directly, then with .html extension, then 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Serve pages/ files from root URL
    # e.g. /services -> pages/services.html
    location /services {
        try_files $uri /services.html /pages/services.html =404;
    }
    location /projects {
        try_files $uri /projects.html /pages/projects.html =404;
    }
    location /about {
        try_files $uri /about.html /pages/about.html =404;
    }
    location /contact {
        try_files $uri /contact.html /pages/contact.html =404;
    }

    # Cache static assets aggressively
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    error_page 404 /index.html;
}
